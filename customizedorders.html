<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Language" content="en">
<title>Customized Orders</title>
<link rel="stylesheet" href="styleCustom.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
<div class="header">
    <img class="logo" src="images/glogo.jpg"/>

    <div class="header-links">
       <a href="index.html">home</a> 
       <a href="customizedorders.html">customized orders</a> 
       <a href="contact.html">contact</a> 
       <a href="signIn.html">
           <button class="btn">Sign In</button>
       </a>
    </div>
</div>
<div class="container">

    <h1>Customize Your Cake 🎂</h1>

    <!-- الشكل -->
    <div class="section">
        <h2>Choose Cake Shape</h2>
        <div class="cards">

            <label class="card">
                <input type="radio" name="shape">
                <img src="images/round.jpg">
                <p>Round</p>
            </label>

            <label class="card">
                <input type="radio" name="shape">      
                <img src="images/Oval.jpg">
                <p>Oval</p>
            </label>

            <label class="card">
                <input type="radio" name="shape">
                <img src="images/Heart.jpg">
                <p>Heart</p>
            </label>

        </div>
    </div>

    <!-- الحجم -->
    <div class="section">
        <div class="section-content">
            <div class="left">
            <h2>Choose Size</h2>
            <div class="cards">

               <label class="card">
                   <input type="radio" name="size">
                   <img src="images/4.jpg">
                   <p>4 inch</p>
               </label>

               <label class="card">
                   <input type="radio" name="size">
                   <img src="images/6.jpg">
                   <p>6 inch</p>
               </label>

              <label class="card">
                 <input type="radio" name="size">
                 <img src="images/8.jpg">
                 <p>8 inch</p>
              </label>

          </div>
      </div>
    
  </div>
</div>




    <!-- النكهة -->
    <div class="section">
        <h2>Choose Flavor</h2>
        <div class="cards">

            <label class="card">
                <input type="radio" name="flavor">
                <img src="images/vanilla.jpg">
                <p>Vanilla</p>
            </label>

            <label class="card">
                <input type="radio" name="flavor">
                <img src="images/chocolate.jpg">
                <p>Chocolate</p>
            </label>

            <label class="card">
                <input type="radio" name="flavor">
                <img src="images/blueberry.jpg">
                <p>blueberry</p>
            </label>

            <label class="card">
                <input type="radio" name="flavor">
                <img src="images/strawberry.jpg">
                <p>Strawberry</p>
            </label>


        </div>
    </div>

    <!-- رفع تصميم -->
    <div class="section">
        <h2>Upload Your Cake Design</h2>

        <div class="upload-box">
            <input type="file">
            <textarea placeholder="Write notes about your design..."></textarea>
        </div>
    </div>

    <button class="btn">Submit Order</button>

</div>

</body>
</html>
